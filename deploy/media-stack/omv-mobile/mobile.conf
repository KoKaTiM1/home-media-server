# Loaded through OMV's existing server-level extension directory.
# Files and assets live outside the packaged OMV web root.
location = /home-media-mobile.css {
    alias /usr/local/share/omv-mobile/mobile.css;
    default_type text/css;
    add_header Cache-Control "no-cache";
}
location = /home-media-mobile.js {
    alias /usr/local/share/omv-mobile/mobile.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache";
}
sub_filter_once on;
sub_filter '</head>' '<link rel="stylesheet" href="/home-media-mobile.css?v=1"><script defer src="/home-media-mobile.js?v=1"></script></head>';
