version: '1.0'
type: component
data:
  name: omv-home-media-workers-page
  type: tabsPage
  config:
    tabs:
    - label: Workers and schedules
      type: datatable
      config:
        autoReload: 10000
        limit: 20
        hasFooter: false
        selectionType: none
        columns:
        - name: Worker
          prop: name
          flexGrow: 1.3
          sortable: false
          cellTemplateName: text
          cellTemplateConfig:
            tooltip: '{{ name }}'
        - name: Health / state
          prop: health
          flexGrow: 1.2
          sortable: false
          cellTemplateName: text
          cellTemplateConfig:
            tooltip: '{{ health }}'
        - name: Schedule
          prop: schedule
          flexGrow: 1.6
          sortable: false
          cellTemplateName: text
          cellTemplateConfig:
            tooltip: '{{ schedule }}'
        - name: Next run
          prop: next_run
          flexGrow: 1.7
          sortable: false
          cellTemplateName: text
          cellTemplateConfig:
            tooltip: '{{ next_run }}'
        - name: Countdown
          prop: countdown
          flexGrow: 1
          sortable: false
          cellTemplateName: text
          cellTemplateConfig:
            tooltip: '{{ countdown }}'
        - name: Last started
          prop: last_run
          flexGrow: 1.7
          sortable: false
          cellTemplateName: text
          cellTemplateConfig:
            tooltip: '{{ last_run }}'
        - name: Last result
          prop: last_result
          flexGrow: 1.2
          sortable: false
          cellTemplateName: text
          cellTemplateConfig:
            tooltip: '{{ last_result }}'
        - name: Current activity
          prop: detail
          flexGrow: 2.5
          sortable: false
          cellTemplateName: text
          cellTemplateConfig:
            tooltip: '{{ detail }}'
        store:
          proxy:
            service: HomeMediaWorkers
            get:
              method: getWorkers
    - label: Catalogue queue and progress
      type: datatable
      config:
        autoReload: 15000
        limit: 60
        hasFooter: false
        selectionType: none
        columns:
        - name: Metric
          prop: name
          flexGrow: 2
          sortable: false
          cellTemplateName: text
          cellTemplateConfig:
            tooltip: '{{ name }}'
        - name: Count / status
          prop: value
          flexGrow: 1.4
          sortable: false
          cellTemplateName: text
          cellTemplateConfig:
            tooltip: '{{ value }}'
        - name: Meaning
          prop: detail
          flexGrow: 3
          sortable: false
          cellTemplateName: text
          cellTemplateConfig:
            tooltip: '{{ detail }}'
        - name: Snapshot updated
          prop: updated
          flexGrow: 1.5
          sortable: false
          cellTemplateName: text
          cellTemplateConfig:
            tooltip: '{{ updated }}'
        store:
          proxy:
            service: HomeMediaWorkers
            get:
              method: getCounts
        hints:
        - type: info
          text: Counters refresh in the background; the snapshot timestamp shows their age. Source and episode checks are
            counted separately from visible movies and shows. Failed sources remain
            saved for retries.
